openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: pharmacies
    description: Pharmacy management
  - name: ocr-logs
    description: AI/OCR scan logs
  - name: orders
    description: Order management
  - name: settings
    description: Platform settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /pharmacies:
    get:
      operationId: listPharmacies
      tags: [pharmacies]
      summary: List all pharmacies
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of pharmacies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pharmacy"
    post:
      operationId: createPharmacy
      tags: [pharmacies]
      summary: Create a pharmacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePharmacyBody"
      responses:
        "201":
          description: Created pharmacy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pharmacy"

  /pharmacies/{id}:
    get:
      operationId: getPharmacy
      tags: [pharmacies]
      summary: Get a pharmacy by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pharmacy details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pharmacy"
        "404":
          description: Not found

  /ocr-logs:
    get:
      operationId: listOcrLogs
      tags: [ocr-logs]
      summary: List AI/OCR scan logs
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of OCR logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OcrLog"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get platform settings
      responses:
        "200":
          description: Platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update platform settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Pharmacy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        phone:
          type: string
        openingHours:
          type: string
        externalUrl:
          type: string
        externalKey:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - address
        - createdAt

    CreatePharmacyBody:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        phone:
          type: string
        openingHours:
          type: string
        externalUrl:
          type: string
        externalKey:
          type: string
      required:
        - name
        - address

    UpdatePharmacyStatusBody:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OcrLog:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        status:
          type: string
        processingTimeMs:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - status
        - createdAt

    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        pharmacyId:
          type: string
        deliveryAddressId:
          type: string
        status:
          type: string
        totalPrice:
          type: number
        prescriptionUrl:
          type: string
        createdAt:
          type: string
      required:
        - id
        - userId
        - pharmacyId
        - createdAt

    UpdateOrderStatusBody:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Settings:
      type: object
      properties:
        id:
          type: string
        platformName:
          type: string
        supportEmail:
          type: string
        ocrConfidenceThreshold:
          type: number
        autoApprovePharmacies:
          type: boolean
        maxPrescriptionsPerDay:
          type: integer
        maintenanceMode:
          type: boolean
        updatedAt:
          type: string
      required:
        - id
        - platformName
        - supportEmail
        - ocrConfidenceThreshold
        - autoApprovePharmacies
        - maxPrescriptionsPerDay
        - maintenanceMode
        - updatedAt

    UpdateSettingsBody:
      type: object
      properties:
        platformName:
          type: string
        supportEmail:
          type: string
        ocrConfidenceThreshold:
          type: number
        autoApprovePharmacies:
          type: boolean
        maxPrescriptionsPerDay:
          type: integer
        maintenanceMode:
          type: boolean
